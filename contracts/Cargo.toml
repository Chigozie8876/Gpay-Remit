[package]
name = "gpay-remit-contracts"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "21.0.0"

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
proptest = "1.4.0"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "remittance_bench"
harness = false

[[bench]]
name = "escrow_bench"
harness = false

[features]
prop = []
integration = []
# Contract selection for Wasm builds. The contracts in this crate share
# entry-point names (e.g. get_global_rate_limit_config), so a single Wasm
# module cannot export more than one of them. Build one contract per module:
#   cargo build --release --target wasm32v1-none --features escrow
# Native (test) builds ignore these and export every contract.
escrow = []
hub = []
mock-oracle = []
mock-kyc = []
mock-aml = []

# Size-optimised profile for deployable Wasm (Soroban caps contract code at
# 128 KiB). Separate from `release` so criterion benches keep opt-level 3.
#   cargo build --profile release-wasm --target wasm32v1-none --features <contract>
[profile.release-wasm]
inherits = "release"
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
